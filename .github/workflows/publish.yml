name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm trusted publishing runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack release artifact
        run: npm run pack

      - name: Resolve dist tag
        id: dist-tag
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const { readFileSync } = require("node:fs");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const manifest = JSON.parse(readFileSync("plugin.manifest.json", "utf8"));
          if (pkg.version !== manifest.version) {
            throw new Error(`package version ${pkg.version} does not match manifest ${manifest.version}`);
          }
          if (process.env.GITHUB_REF?.startsWith("refs/tags/") && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`release tag ${process.env.GITHUB_REF_NAME} does not match package v${pkg.version}`);
          }
          console.log(`name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          console.log(`tag=${pkg.version.includes("-") ? "alpha" : "latest"}`);
          NODE

      - name: Check registry
        id: registry
        run: |
          if npm view "${{ steps.dist-tag.outputs.name }}@${{ steps.dist-tag.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish ./artifacts/*.tgz --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Verify registry version
        run: |
          for _ in {1..12}; do
            actual="$(npm view "${{ steps.dist-tag.outputs.name }}@${{ steps.dist-tag.outputs.version }}" version 2>/dev/null || true)"
            test "$actual" = "${{ steps.dist-tag.outputs.version }}" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
